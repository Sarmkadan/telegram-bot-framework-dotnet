name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10.0.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore telegram-bot-framework-dotnet.slnx

    - name: Build
      run: dotnet build telegram-bot-framework-dotnet.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test telegram-bot-framework-dotnet.slnx --no-build --configuration Release --verbosity normal
