name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Run tests
      run: dotnet test --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

    - name: Code analysis
      run: dotnet build --no-restore /p:EnforceCodeStyleInBuild=true

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish
      run: dotnet publish -c ${{ env.CONFIGURATION }} -o ./publish src/TelegramBotFramework/TelegramBotFramework.csproj

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: telegram-bot-framework-${{ github.sha }}
        path: ./publish

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: telegram-bot:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Docker container health check
      run: |
        docker build -t telegram-bot:test .
        docker run -d --name bot-test -p 5001:5001 telegram-bot:test
        sleep 10
        curl -f http://localhost:5001/api/bot/health || exit 1
        docker stop bot-test

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run security checks
      uses: github/super-linter@v4
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Build and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin /k:"Sarmkadan_telegram-bot-framework-dotnet" /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
        dotnet build --configuration ${{ env.CONFIGURATION }}
        dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
      if: env.SONAR_TOKEN != ''
